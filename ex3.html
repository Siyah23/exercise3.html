<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML/CSS Exercise 3</title>
    <style>
      body {
        font-family: arial, san;
        margin: 40px;
        background-color: #ffff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid black;
        padding: 10px;
        text-align: left;
        font-size: 14px;
        color: #555;
      }
      td:nth-child(1),
      td:nth-child(2) {
        text-align: left;
      }
      td:nth-child(3),
      td:nth-child(4),
      td:nth-child(5) {
        text-align: right;
      }
      th {
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>Rank</th>
        <th>Province</th>
        <th>Population (2011)</th>
        <th>Area (km²)</th>
        <th>Density (per km²)</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Gauteng</td>
        <td>12,272,263</td>
        <td>18,178</td>
        <td>675.1</td>
      </tr>
      <tr>
        <td>2</td>
        <td>KwaZulu-Natal</td>
        <td>10,272,263</td>
        <td>120,361</td>
        <td>85.3</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Mpumalanga</td>
        <td>4,039,939</td>
        <td>76,495</td>
        <td>52.8</td>
      </tr>
      <tr>
        <td>4</td>
        <td>Western Cape</td>
        <td>5,822,734</td>
        <td>129,462</td>
        <td>45.0</td>
      </tr>
      <tr>
        <td>5</td>
        <td>Limpopo</td>
        <td>5,404,868</td>
        <td>125,755</td>
        <td>43.0</td>
      </tr>
    </table>
  </body>
</html>
